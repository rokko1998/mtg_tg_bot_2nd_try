version: "3.9"
services:
  bot_app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: bot_app
    depends_on:
      - db
      - redis
      - celery_worker
    env_file:
      - ./.env
    environment:
      - REDIS_HOST=redis_cache
    restart: always
    volumes:
      - ./logs:/app/logs  # Монтируем папку логов
    networks:
      - app_network

  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - ./.env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    volumes:
      - redis_data:/data  # Храним данные Redis в volume
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf  # Подключаем конфигурационный файл
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - app_network

  celery_worker:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: celery_worker
    command: celery -A app.celery_config worker --loglevel=info
    depends_on:
      - redis
      - db
    restart: always
    environment:
      - REDIS_HOST=redis_cache
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    depends_on:
      - bot_app
      - db
      - redis
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  logs:
